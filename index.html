<!doctype html>
<html lang="ru">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>MAXигра — Русские шашки</title><link rel="stylesheet" href="style.css?v=20260923-5"><link rel="stylesheet" href="russian-checkers.css?v=20260922-4"><link rel="stylesheet" href="shop.css?v=20260923-8"><link rel="stylesheet" href="online.css?v=20260907-1"><link rel="stylesheet" href="profile.css?v=20260918-1"><link rel="stylesheet" href="leaderboard.css?v=20260922-4"><link rel="stylesheet" href="admin.css?v=20260919-2"><link rel="stylesheet" href="premium-ui.css?v=20260923-2"><link rel="stylesheet" href="fullscreen-ui.css?v=20260923-6"><link rel="preload" as="image" href="assets/boards/IMG_4486.jpeg"><link rel="preload" as="image" href="assets/boards/IMG_4487.jpeg"><link rel="preload" as="image" href="assets/boards/IMG_4586.jpeg"><link rel="preload" as="image" href="assets/boards/IMG_4587.jpeg"><script src="https://st.max.ru/js/max-web-app.js"></script><script src="max.js?v=20260928-1"></script><script src="asset-cache.js?v=20260928-1"></script><script>
(()=>{let done=false;
const hide=()=>{if(done)return;done=true;const el=document.getElementById('startup-screen');if(el){el.classList.add('startup-screen--hide');setTimeout(()=>el.remove(),320)}};
window.addEventListener('max-profile-ready',hide,{once:true});
setTimeout(hide,2500);
})();
</script></head>
<body>
  <div id="startup-screen" class="startup-screen">
    <img id="startup-logo-image" class="startup-logo-image" src="assets/liderbort/IMG_4623.PNG" alt="Шашки">
  </div>
  <main id="app">
    <section id="auth-screen" class="screen active">
      <div class="auth-loading">Загрузка…</div>
    </section>
    <section id="menu-screen" class="screen">
      <div class="menu-content">
        <img id="menu-logo-image" class="menu-logo-image" src="assets/liderbort/IMG_4623.PNG" alt="Шашки">
        <div class="menu-buttons">
          <button id="play-btn" class="image-button play-button" type="button">Играть</button>
          <button id="online-play-btn" class="image-button online-button" type="button">Играть онлайн</button>
          <div class="secondary-buttons">
            <button id="profile-btn" class="image-button" type="button">Профиль</button>
            <button id="leaderboard-btn" class="image-button" type="button">Лидеры</button>
            <button id="rules-btn" class="image-button" type="button">Правила</button>
          </div>
          <button id="shop-btn" class="image-button shop-button" type="button">Магазин</button>
        </div>
      </div>
    </section>
  </main>
  <div id="app-overlay-root"></div>

  <script src="api-base.js?v=20260928-2"></script>
  <script src="max.js?v=20260928-3"></script>
  <script src="auth.js?v=20260928-3"></script>
  <script src="shop.js?v=20260923-4"></script>
  <script src="checkers-engine.js?v=20260917-2"></script>
  <script src="russian-checkers.js?v=20260917-2"></script>
  <script src="online-core.js?v=20260917-2"></script>
  <script src="online-api.js?v=20260917-2"></script>
  <script src="online.js?v=20260917-2"></script>
  <script src="online-lobby.js?v=20260917-2"></script>
  <script src="shop-ui.js?v=20260923-1"></script>
  <script src="admin-ui.js?v=20260926-5"></script>
  <script src="leaderboard.js?v=20260922-2"></script>
  <script src="app.js?v=20260923-2"></script>
  <script src="asset-cache.js?v=20260928-3"></script>
  <script>
    (() => {
      let done = false;
      const hide = () => {
        if (done) return;
        done = true;
        const el = document.getElementById('startup-screen');
        if (!el) return;
        el.classList.add('startup-screen--hide');
        setTimeout(() => el.remove(), 320);
      };
      window.addEventListener('max-profile-ready', hide, { once: true });
      setTimeout(hide, 2500);
    })();
  </script>
</body></body></html>
