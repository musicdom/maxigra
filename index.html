<!doctype html>
<html lang="ru">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>MAXигра — Русские шашки</title><link rel="stylesheet" href="style.css?v=20260923-5"><link rel="stylesheet" href="russian-checkers.css?v=20260922-4"><link rel="stylesheet" href="shop.css?v=20260923-8"><link rel="stylesheet" href="online.css?v=20260907-1"><link rel="stylesheet" href="profile.css?v=20260918-1"><link rel="stylesheet" href="leaderboard.css?v=20260922-4"><link rel="stylesheet" href="admin.css?v=20260919-2"><link rel="stylesheet" href="premium-ui.css?v=20260923-2"><link rel="stylesheet" href="fullscreen-ui.css?v=20260923-6"><link rel="preload" as="image" href="assets/boards/IMG_4486.jpeg"><link rel="preload" as="image" href="assets/boards/IMG_4487.jpeg"><link rel="preload" as="image" href="assets/boards/IMG_4586.jpeg"><link rel="preload" as="image" href="assets/boards/IMG_4587.jpeg"><script src="https://st.max.ru/js/max-web-app.js"></script><script src="max.js?v=20260928-1"></script><script src="asset-cache.js?v=20260928-1"></script><script>
(()=>{let done=false;
const hide=()=>{if(done)return;done=true;const el=document.getElementById('startup-screen');if(el){el.classList.add('startup-screen--hide');setTimeout(()=>el.remove(),320)}};
window.addEventListener('max-profile-ready',hide,{once:true});
setTimeout(hide,2500);
})();
</script></head>
<body><div id="menu-screen" class="screen" style="display:none"></div><div id="auth-screen" class="screen" style="display:none"></div><div id="max-diag" style="position:fixed;inset:0;z-index:2147483647;background:#fff;color:#111;font:15px/1.45 -apple-system,BlinkMacSystemFont,sans-serif;padding:24px 18px;overflow:auto"><div style="width:min(620px,100%);margin:auto"><h2 style="margin:0 0 14px">Диагностика запуска Шашек</h2><div id="s" style="padding:14px;border-radius:12px;background:#f2f2f2">Запуск…</div><pre id="d" style="white-space:pre-wrap;margin-top:12px;font-size:12px;color:#555"></pre></div></div>
<script>
(async()=>{
const s=document.getElementById('s'),d=document.getElementById('d'),log=[];
window.addEventListener('error',e=>log.push('RUNTIME ERROR: '+(e.message||'unknown')+' @ '+(e.filename||'')+':'+(e.lineno||'')));
window.addEventListener('unhandledrejection',e=>log.push('UNHANDLED: '+(e.reason?.message||e.reason||'unknown')));
const files=['max.js?v=20260928-2','api-base.js?v=20260928-1','online-api.js?v=20260917-2','auth.js?v=20260928-2','shop.js?v=20260923-4','checkers-engine.js?v=20260917-2','russian-checkers.js?v=20260917-2','online-core.js?v=20260917-2','online.js?v=20260917-2','online-lobby.js?v=20260917-2','shop-ui.js?v=20260923-1','admin-ui.js?v=20260926-5','leaderboard.js?v=20260922-2','app.js?v=20260923-2'];
for(const src of files){
 await new Promise(resolve=>{
  const x=document.createElement('script'); x.src=src; x.onload=()=>{log.push('EXEC OK '+src);setTimeout(resolve,250)}; x.onerror=()=>{log.push('EXEC LOAD ERROR '+src);resolve()}; document.body.appendChild(x);
 });
}
let profile='not tested';
try{
 const init=window.WebApp?.initData||'';
 const r=await fetch('/api/profile',{method:'POST',headers:{'content-type':'application/json','x-max-init-data':init},body:JSON.stringify({name:'Диагностика'}),cache:'no-store'});
 const t=await r.text(); profile='HTTP '+r.status+' — '+t.slice(0,300);
}catch(e){profile='ERROR — '+e.message}
log.push('PROFILE: '+profile);
log.push('CheckersAuth: '+(window.CheckersAuth?JSON.stringify({ready:window.CheckersAuth.ready,guest:window.CheckersAuth.guest,id:window.CheckersAuth.user?.id}):'нет'));
log.push('MAXIGRA_MAX: '+(window.MAXIGRA_MAX?'есть':'нет'));
log.push('API URL: '+(window.maxigraApiUrl?window.maxigraApiUrl('/api/profile'):'нет'));
s.textContent='Проверка завершена'; d.textContent=log.join('\n');
})();
</script></body></html>
